<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจองโต๊ะ</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 { margin-bottom: 5px; color: #818cf8; text-align: center; }
        p { color: #94a3b8; font-size: 14px; text-align: center; margin-top: 0; }
        .stage {
            width: 100%;
            max-width: 500px;
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(99, 102, 241, 0.4);
            padding: 10px;
            text-align: center;
            border-radius: 8px;
            color: #c7d2fe;
            letter-spacing: 2px;
            font-weight: bold;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        #seating-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            max-width: 100%;
            padding: 10px;
        }
        .row-container {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }
        .seat {
            width: 45px;
            height: 40px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid rgba(99, 102, 241, 0.4);
            background-color: rgba(30, 27, 75, 0.6);
            color: #e0e7ff;
            transition: 0.2s;
        }
        .seat:hover:not(:disabled) {
            background-color: #6366f1;
            color: #fff;
        }
        .seat.booked {
            background-color: #334155;
            color: #64748b;
            border-color: #1e293b;
            cursor: not-allowed;
        }
        .seat.selected {
            background-color: #eab308;
            color: #0f172a;
            border-color: #ca8a04;
        }
        .summary-box {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            margin-bottom: 15px;
        }
        .summary-box p { color: #cbd5e1; margin: 10px 0; font-size: 16px; }
        .highlight-seats { color: #facc15; font-weight: bold; }
        .highlight-price { color: #4ade80; font-weight: bold; font-size: 20px; }
        .book-btn {
            margin-top: 15px;
            width: 100%;
            background-color: #4f46e5;
            color: white;
            font-weight: bold;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }
        .book-btn:hover:not(:disabled) { background-color: #4338ca; }
        .book-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .search-slip-btn {
            background-color: #334155;
            color: #94a3b8;
            border: 1px dashed #64748b;
            padding: 10px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 30px;
            transition: 0.2s;
        }
        .search-slip-btn:hover { background-color: #1e293b; color: #fff; border-color: #818cf8; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 380px;
            border: 1px solid #475569;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content h3 { margin-top: 0; color: #818cf8; text-align: center; }
        .form-group { margin-bottom: 12px; text-align: left; }
        .form-group label { display: block; margin-bottom: 4px; font-size: 13px; color: #94a3b8; }
        .form-group input {
            width: 100%;
            padding: 9px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: white;
            box-sizing: border-box;
            font-size: 14px;
        }
        .form-group input:focus { outline: none; border-color: #6366f1; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn-submit { background-color: #22c55e; color: white; border: none; padding: 10px; border-radius: 6px; flex: 1; font-weight: bold; cursor: pointer; }
        .btn-submit:hover { background-color: #16a34a; }
        .btn-cancel { background-color: #64748b; color: white; border: none; padding: 10px; border-radius: 6px; flex: 1; font-weight: bold; cursor: pointer; }
        .btn-cancel:hover { background-color: #475569; }
    </style>
</head>
<body>

    <header style="text-align: center; margin-bottom: 20px;">
        <h1>🍻 ระบบจองโต๊ะ</h1>
        <p>เลือกโต๊ะที่ต้องการ (ระบบอัปเดตสถานะอัตโนมัติ)</p>
    </header>

    <div class="stage">STAGE / เวที / หน้าเวที</div>

    <div id="seating-grid">
        <p style="color: #94a3b8; text-align: center; width: 100%;">กำลังโหลดสถานะโต๊ะ...</p>
    </div>

    <div class="summary-box">
        <p>โต๊ะที่เลือก: <span id="selected-seats" class="highlight-seats">ยังไม่ได้เลือก</span></p>
        <p>ยอดรวมมัดจำ: <span id="total-price" class="highlight-price">0</span> บาท</p>
        <button id="book-btn" class="book-btn" disabled>จองโต๊ะที่เลือก</button>
    </div>

    <button class="search-slip-btn" onclick="openSearchModal()">🔍 เคยจองแล้ว? ค้นหาการจอง / แนบสลิปย้อนหลัง</button>

    <div id="booking-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>📝 รายละเอียดการจอง</h3>
            <div class="form-group">
                <label>โต๊ะที่เลือก:</label>
                <input type="text" id="modal-seat-id" readonly style="background-color: #334155; color: #facc15; font-weight: bold;">
            </div>
            <div class="form-group">
                <label>ยอดมัดจำที่ต้องชำระ:</label>
                <input type="text" id="modal-seat-price" readonly style="background-color: #334155; color: #4ade80; font-weight: bold;">
            </div>
            <div class="form-group">
                <label for="customer-name">ชื่อผู้จอง:</label>
                <input type="text" id="customer-name" placeholder="ระบุชื่อ-นามสกุล">
            </div>
            <div class="form-group">
                <label for="customer-phone">เบอร์โทรศัพท์:</label>
                <input type="tel" id="customer-phone" placeholder="ระบุเบอร์โทรศัพท์">
            </div>
            <div class="btn-group">
                <button type="button" class="btn-cancel" onclick="closeModal()">ยกเลิก</button>
                <button type="button" id="confirm-btn" class="btn-submit" onclick="confirmBooking()">ยืนยันการจอง</button>
            </div>
        </div>
    </div>

    <div id="search-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>🔍 ค้นหาการจองด้วยเบอร์โทร</h3>
            <div class="form-group">
                <label for="search-phone-input">กรอกเบอร์โทรศัพท์ของคุณ:</label>
                <input type="tel" id="search-phone-input" placeholder="ระบุเบอร์โทรที่ใช้จอง">
            </div>
            <button type="button" class="btn-submit" style="width: 100%; margin-bottom: 15px;" onclick="searchBooking()">ค้นหาการจอง</button>
            
            <div id="search-result" style="margin-bottom: 15px; font-size: 14px; color: #cbd5e1;"></div>

            <div class="form-group" id="slip-upload-section" style="display: none;">
                <label for="retro-slip-file">แนบสลิปการโอนเงิน:</label>
                <input type="file" id="retro-slip-file" accept="image/*" style="background-color: #334155; padding: 6px;">
            </div>

            <div class="btn-group">
                <button type="button" class="btn-cancel" onclick="closeSearchModal()">ปิดหน้าต่าง</button>
                <button type="button" id="upload-retro-btn" class="btn-submit" style="display: none;" onclick="uploadRetroSlip()">ส่งสลิปยืนยัน</button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyV6fY_IHi-JbY7TinHiTApQ9icpkA6DHiCnnVjiazBup6YX5dL4KJbxXMyE8D9njYU/exec";

        const grid = document.getElementById('seating-grid');
        const selectedSeatsEl = document.getElementById('selected-seats');
        const totalPriceEl = document.getElementById('total-price');
        const bookBtn = document.getElementById('book-btn');
        const modal = document.getElementById('booking-modal');
        const modalSeatId = document.getElementById('modal-seat-id');
        const modalSeatPrice = document.getElementById('modal-seat-price');
        const confirmBtn = document.getElementById('confirm-btn');

        const searchModal = document.getElementById('search-modal');
        const searchPhoneInput = document.getElementById('search-phone-input');
        const searchResult = document.getElementById('search-result');
        const slipUploadSection = document.getElementById('slip-upload-section');
        const uploadRetroBtn = document.getElementById('upload-retro-btn');

        const totalTables = 40;  
        const colsPerRow = 10;   
        const pricePerTable = 500; 
        let selected = [];
        let foundPhoneForSlip = "";
        let foundTableForSlip = ""; // เพิ่มตัวเก็บเลขโต๊ะที่จะแนบสลิป

        function fetchSeatStatus() {
            fetch(SCRIPT_URL)
                .then(response => response.json())
                .then(bookedTables => {
                    renderGrid(bookedTables);
                })
                .catch(error => {
                    console.error('Error loading seats:', error);
                });
        }

        window.onload = function() {
            fetchSeatStatus();
            setInterval(fetchSeatStatus, 10000);
        };

        function renderGrid(bookedTables) {
            const currentGrid = document.getElementById('seating-grid');
            if (currentGrid.children.length === 0 || currentGrid.querySelector('p')) {
                grid.innerHTML = ''; 
            }

            let rowDiv = document.createElement('div');
            rowDiv.className = 'row-container';

            for (let i = 1; i <= totalTables; i++) {
                const seatId = i.toString(); 
                
                let seat = document.getElementById(`seat-${seatId}`);
                const isBooked = bookedTables.includes(seatId);

                if (!seat) {
                    seat = document.createElement('button');
                    seat.id = `seat-${seatId}`;
                    seat.innerText = i;
                }
                
                seat.className = `seat ${isBooked ? 'booked' : ''} ${selected.includes(seatId) ? 'selected' : ''}`;
                seat.disabled = isBooked;

                if (!isBooked) {
                    seat.onclick = () => {
                        if (selected.includes(seatId)) {
                            selected = selected.filter(s => s !== seatId);
                            seat.classList.remove('selected');
                        } else {
                            selected.push(seatId);
                            seat.classList.add('selected');
                        }
                        updateSummary();
                    };
                } else {
                    if (selected.includes(seatId)) {
                        selected = selected.filter(s => s !== seatId);
                        updateSummary();
                    }
                }

                rowDiv.appendChild(seat);

                if (i % colsPerRow === 0 && i < totalTables) {
                    grid.appendChild(rowDiv);
                    rowDiv = document.createElement('div');
                    rowDiv.className = 'row-container';
                }
            }
            grid.appendChild(rowDiv);
        }

        function updateSummary() {
            if (selected.length > 0) {
                const totalPrice = selected.length * pricePerTable;
                selectedSeatsEl.innerText = selected.join(', ');
                totalPriceEl.innerText = totalPrice.toLocaleString(); 
                bookBtn.disabled = false;
            } else {
                selectedSeatsEl.innerText = 'ยังไม่ได้เลือก';
                totalPriceEl.innerText = '0';
                bookBtn.disabled = true;
            }
        }

        bookBtn.onclick = () => {
            const totalPrice = selected.length * pricePerTable;
            modalSeatId.value = selected.join(', ');
            modalSeatPrice.value = totalPrice.toLocaleString() + " บาท";
            modal.style.display = 'flex';
        };

        function closeModal() {
            modal.style.display = 'none';
        }

        function confirmBooking() {
            const name = document.getElementById('customer-name').value.trim();
            const phone = document.getElementById('customer-phone').value.trim();

            if (!name || !phone) {
                alert('กรุณากรอกชื่อและเบอร์โทรศัพท์ให้ครบถ้วนครับ');
                return;
            }

            confirmBtn.disabled = true;
            confirmBtn.innerText = "กำลังตรวจสอบโต๊ะ...";

            const totalPrice = selected.length * pricePerTable;
            const bookedSeatsText = selected.join(', ');

            const bookingData = {
                seats: selected,
                name: name,
                phone: phone,
                price: totalPrice
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(bookingData)
            })
            .then(res => res.json())
            .then(resData => {
                confirmBtn.disabled = false;
                confirmBtn.innerText = "ยืนยันการจอง";

                if (resData.result === "success") {
                    alert(`✅ บันทึกการจองโต๊ะที่ ${bookedSeatsText} เรียบร้อย!\nยอดมัดจำ: ${totalPrice.toLocaleString()} บาท\n\n⚠️ กรุณาโอนเงินมัดจำและส่งสลิปภายใน 1 ชั่วโมงครับ`);
                    closeModal();
                    selected = []; 
                    updateSummary();
                    document.getElementById('customer-name').value = '';
                    document.getElementById('customer-phone').value = '';
                    fetchSeatStatus();
                } else {
                    alert(`❌ ${resData.message}`);
                    closeModal();
                    fetchSeatStatus();
                }
            })
            .catch(error => {
                alert(`✅ บันทึกการจองโต๊ะที่ ${bookedSeatsText} เรียบร้อย!\nยอดมัดจำ: ${totalPrice.toLocaleString()} บาท\n\n⚠️ กรุณาโอนเงินมัดจำและส่งสลิปภายใน 1 ชั่วโมงครับ`);
                closeModal();
                selected = []; 
                updateSummary();
                document.getElementById('customer-name').value = '';
                document.getElementById('customer-phone').value = '';
                fetchSeatStatus();
                confirmBtn.disabled = false;
                confirmBtn.innerText = "ยืนยันการจอง";
            });
        }

        function openSearchModal() {
            searchPhoneInput.value = '';
            searchResult.innerHTML = '';
            slipUploadSection.style.display = 'none';
            uploadRetroBtn.style.display = 'none';
            searchModal.style.display = 'flex';
        }

        function closeSearchModal() {
            searchModal.style.display = 'none';
        }

        function searchBooking() {
            const phone = searchPhoneInput.value.trim();
            if (!phone) {
                alert('กรุณากรอกเบอร์โทรศัพท์เพื่อค้นหาครับ');
                return;
            }

            searchResult.innerHTML = "กำลังค้นหาข้อมูลการจอง...";
            slipUploadSection.style.display = 'none';
            uploadRetroBtn.style.display = 'none';

            fetch(`${SCRIPT_URL}?phone=${encodeURIComponent(phone)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.length > 0) {
                        foundPhoneForSlip = phone;
                        foundTableForSlip = data[0].table.toString(); // เก็บเลขโต๊ะแรกที่เจอมาพ่วงตอนส่งสลิป
                        let html = `<b>พบข้อมูลการจองของคุณ:</b><br>`;
                        data.forEach(item => {
                            html += `• โต๊ะหมายเลข: <span style="color: #facc15; font-weight: bold;">${item.table}</span> (สถานะ: ${item.status})<br>`;
                        });
                        searchResult.innerHTML = html;
                        slipUploadSection.style.display = 'block';
                        uploadRetroBtn.style.display = 'block';
                    } else {
                        searchResult.innerHTML = `<span style="color: #ef4444;">❌ไม่พบข้อมูลการจองที่ใช้เบอร์โทรนี้ หรืออาจจะถูกยกเลิกไปแล้ว</span>`;
                    }
                })
                .catch(err => {
                    searchResult.innerHTML = `<span style="color: #ef4444;">เกิดข้อผิดพลาดในการค้นหา กรุณาลองใหม่อีกครั้ง</span>`;
                });
        }

        function uploadRetroSlip() {
            const fileInput = document.getElementById('retro-slip-file');
            if (fileInput.files.length === 0) {
                alert('กรุณาเลือกรูปสลิปการโอนเงินก่อนกดส่งครับ');
                return;
            }

            uploadRetroBtn.disabled = true;
            uploadRetroBtn.innerText = "กำลังอัปโหลดสลิป...";

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(event) {
                const base64Data = event.target.result;
                const payload = {
                    action: "upload_slip",
                    phone: foundPhoneForSlip,
                    table: foundTableForSlip, // ส่งเลขโต๊ะพ่วงไปหลังบ้านด้วย
                    slipData: base64Data,
                    slipName: file.name,
                    slipMimeType: file.type
                };

                fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                })
                .then(res => res.json())
                .then(data => {
                    alert('✅ ส่งสลิปยืนยันการโอนเงินเรียบร้อยแล้ว!\nทางร้านจะทำการตรวจสอบและอัปเดตสถานะให้เร็วที่สุดครับ');
                    closeSearchModal();
                    uploadRetroBtn.disabled = false;
                    uploadRetroBtn.innerText = "ส่งสลิปยืนยัน";
                    fetchSeatStatus();
                })
                .catch(error => {
                    alert('✅ ส่งสลิปยืนยันการโอนเงินเรียบร้อยแล้ว!');
                    closeSearchModal();
                    uploadRetroBtn.disabled = false;
                    uploadRetroBtn.innerText = "ส่งสลิปยืนยัน";
                    fetchSeatStatus();
                });
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
