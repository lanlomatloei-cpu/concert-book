<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจองตั๋วคอนเสิร์ต</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 { margin-bottom: 5px; color: #818cf8; text-align: center; }
        p { color: #94a3b8; font-size: 14px; text-align: center; margin-top: 0; }
        .stage {
            width: 100%;
            max-width: 500px;
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(99, 102, 241, 0.4);
            padding: 10px;
            text-align: center;
            border-radius: 8px;
            color: #c7d2fe;
            letter-spacing: 2px;
            font-weight: bold;
            margin-bottom: 30px;
            text-transform: uppercase;
        }
        #seating-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 30px;
            overflow-x: auto;
            max-width: 100%;
            padding: 10px;
        }
        .row-container {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }
        .row-label {
            width: 24px;
            text-align: center;
            font-weight: bold;
            color: #94a3b8;
            font-size: 14px;
        }
        .seat {
            width: 32px;
            height: 32px;
            border-radius: 6px 6px 0 0;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid rgba(99, 102, 241, 0.4);
            background-color: rgba(30, 27, 75, 0.6);
            color: #e0e7ff;
            transition: 0.2s;
        }
        .seat:hover:not(:disabled) {
            background-color: #6366f1;
            color: #fff;
        }
        .seat.booked {
            background-color: #334155;
            color: #64748b;
            border-color: #1e293b;
            cursor: not-allowed;
        }
        .seat.selected {
            background-color: #eab308;
            color: #0f172a;
            border-color: #ca8a04;
        }
        .summary-box {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
        .summary-box p { color: #cbd5e1; margin: 10px 0; font-size: 16px; }
        .highlight-seats { color: #facc15; font-weight: bold; }
        .highlight-price { color: #4ade80; font-weight: bold; font-size: 20px; }
        .book-btn {
            margin-top: 15px;
            width: 100%;
            background-color: #4f46e5;
            color: white;
            font-weight: bold;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }
        .book-btn:hover:not(:disabled) { background-color: #4338ca; }
        .book-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

    <header style="text-align: center; margin-bottom: 20px;">
        <h1>🎟️ ระบบจองตั๋วคอนเสิร์ต</h1>
        <p>เลือกที่นั่ง 10 แถว (A-J) แถวละ 11 ที่นั่ง</p>
    </header>

    <div class="stage">STAGE / เวที</div>

    <div id="seating-grid"></div>

    <div class="summary-box">
        <p>ที่นั่งที่เลือก: <span id="selected-seats" class="highlight-seats">ยังไม่ได้เลือก</span></p>
        <p>ราคารวม: <span id="total-price" class="highlight-price">0</span> บาท</p>
        <button id="book-btn" class="book-btn" disabled>ยืนยันการจอง</button>
    </div>

    <script>
        const grid = document.getElementById('seating-grid');
        const selectedSeatsEl = document.getElementById('selected-seats');
        const totalPriceEl = document.getElementById('total-price');
        const bookBtn = document.getElementById('book-btn');

        const rows = 10;
        const cols = 11;
        const rowLabels = ['A','B','C','D','E','F','G','H','I','J'];
        let selected = [];

        for (let r = 0; r < rows; r++) {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'row-container';
            
            const label = document.createElement('span');
            label.className = 'row-label';
            label.innerText = rowLabels[r];
            rowDiv.appendChild(label);

            for (let c = 1; c <= cols; c++) {
                const seatId = `${rowLabels[r]}${c}`;
                const seat = document.createElement('button');
                
                const isBooked = Math.random() < 0.15;
                
                seat.className = `seat ${isBooked ? 'booked' : ''}`;
                seat.innerText = c;
                seat.disabled = isBooked;

                if (!isBooked) {
                    seat.onclick = () => {
                        if (selected.includes(seatId)) {
                            selected = selected.filter(s => s !== seatId);
                            seat.classList.remove('selected');
                        } else {
                            selected.push(seatId);
                            seat.classList.add('selected');
                        }
                        updateSummary();
                    };
                }
                rowDiv.appendChild(seat);
            }
            grid.appendChild(rowDiv);
        }

        function updateSummary() {
            if (selected.length > 0) {
                selectedSeatsEl.innerText = selected.join(', ');
                totalPriceEl.innerText = (selected.length * 1500).toLocaleString();
                bookBtn.disabled = false;
            } else {
                selectedSeatsEl.innerText = 'ยังไม่ได้เลือก';
                totalPriceEl.innerText = '0';
                bookBtn.disabled = true;
            }
        }

        bookBtn.onclick = () => {
            alert(`จองสำเร็จ!\nที่นั่ง: ${selected.join(', ')}\nราคารวม: ${(selected.length * 1500).toLocaleString()} บาท`);
            location.reload();
        };
    </script>
</body>
</html>
