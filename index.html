<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจองตั๋วคอนเสิร์ต</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 { margin-bottom: 5px; color: #818cf8; text-align: center; }
        p { color: #94a3b8; font-size: 14px; text-align: center; margin-top: 0; }
        .stage {
            width: 100%;
            max-width: 500px;
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(99, 102, 241, 0.4);
            padding: 10px;
            text-align: center;
            border-radius: 8px;
            color: #c7d2fe;
            letter-spacing: 2px;
            font-weight: bold;
            margin-bottom: 30px;
            text-transform: uppercase;
        }
        #seating-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 30px;
            overflow-x: auto;
            max-width: 100%;
            padding: 10px;
        }
        .row-container {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }
        .row-label {
            width: 24px;
            text-align: center;
            font-weight: bold;
            color: #94a3b8;
            font-size: 14px;
        }
        .seat {
            width: 32px;
            height: 32px;
            border-radius: 6px 6px 0 0;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid rgba(99, 102, 241, 0.4);
            background-color: rgba(30, 27, 75, 0.6);
            color: #e0e7ff;
            transition: 0.2s;
        }
        .seat:hover:not(:disabled) {
            background-color: #6366f1;
            color: #fff;
        }
        .seat.booked {
            background-color: #334155;
            color: #64748b;
            border-color: #1e293b;
            cursor: not-allowed;
        }
        .seat.selected {
            background-color: #eab308;
            color: #0f172a;
            border-color: #ca8a04;
        }
        .summary-box {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
        .summary-box p { color: #cbd5e1; margin: 10px 0; font-size: 16px; }
        .highlight-seats { color: #facc15; font-weight: bold; }
        .highlight-price { color: #4ade80; font-weight: bold; font-size: 20px; }
        .book-btn {
            margin-top: 15px;
            width: 100%;
            background-color: #4f46e5;
            color: white;
            font-weight: bold;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }
        .book-btn:hover:not(:disabled) { background-color: #4338ca; }
        .book-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* สไตล์หน้าต่างป๊อปอัป (Modal) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 380px;
            border: 1px solid #475569;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .modal-content h3 { margin-top: 0; color: #818cf8; text-align: center; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #94a3b8; }
        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: white;
            box-sizing: border-box;
            font-size: 15px;
        }
        .form-group input:focus { outline: none; border-color: #6366f1; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn-submit { background-color: #22c55e; color: white; border: none; padding: 10px; border-radius: 6px; flex: 1; font-weight: bold; cursor: pointer; }
        .btn-submit:hover { background-color: #16a34a; }
        .btn-cancel { background-color: #64748b; color: white; border: none; padding: 10px; border-radius: 6px; flex: 1; font-weight: bold; cursor: pointer; }
        .btn-cancel:hover { background-color: #475569; }
    </style>
</head>
<body>

    <header style="text-align: center; margin-bottom: 20px;">
        <h1>🎟️ ระบบจองตั๋วคอนเสิร์ต</h1>
        <p>เลือกที่นั่ง 10 แถว (A-J) แถวละ 11 ที่นั่ง</p>
    </header>

    <div class="stage">STAGE / เวที</div>

    <div id="seating-grid"></div>

    <div class="summary-box">
        <p>ที่นั่งที่เลือก: <span id="selected-seats" class="highlight-seats">ยังไม่ได้เลือก</span></p>
        <p>ราคารวม: <span id="total-price" class="highlight-price">0</span> บาท</p>
        <button id="book-btn" class="book-btn" disabled>จองที่นั่งที่เลือก</button>
    </div>

    <!-- หน้าต่างป๊อปอัปกรอกข้อมูล -->
    <div id="booking-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>📝 ข้อมูลการจอง</h3>
            <div class="form-group">
                <label>ที่นั่ง/โต๊ะที่เลือก:</label>
                <input type="text" id="modal-seat-id" readonly style="background-color: #334155; color: #facc15; font-weight: bold;">
            </div>
            <div class="form-group">
                <label for="customer-name">ชื่อผู้จอง:</label>
                <input type="text" id="customer-name" placeholder="ระบุชื่อ-นามสกุล">
            </div>
            <div class="form-group">
                <label for="customer-phone">เบอร์โทรศัพท์:</label>
                <input type="tel" id="customer-phone" placeholder="ระบุเบอร์โทรศัพท์">
            </div>
            <div class="btn-group">
                <button type="button" class="btn-cancel" onclick="closeModal()">ยกเลิก</button>
                <button type="button" class="btn-submit" onclick="confirmBooking()">ยืนยันการจอง</button>
            </div>
        </div>
    </div>

    <script>
        const grid = document.getElementById('seating-grid');
        const selectedSeatsEl = document.getElementById('selected-seats');
        const totalPriceEl = document.getElementById('total-price');
        const bookBtn = document.getElementById('book-btn');
        const modal = document.getElementById('booking-modal');
        const modalSeatId = document.getElementById('modal-seat-id');

        const rows = 10;
        const cols = 11;
        const rowLabels = ['A','B','C','D','E','F','G','H','I','J'];
        let selected = [];

        for (let r = 0; r < rows; r++) {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'row-container';
            
            const label = document.createElement('span');
            label.className = 'row-label';
            label.innerText = rowLabels[r];
            rowDiv.appendChild(label);

            for (let c = 1; c <= cols; c++) {
                const seatId = `${rowLabels[r]}${c}`;
                const seat = document.createElement('button');
                
                const isBooked = Math.random() < 0.15;
                
                seat.className = `seat ${isBooked ? 'booked' : ''}`;
                seat.innerText = c;
                seat.disabled = isBooked;

                if (!isBooked) {
                    seat.onclick = () => {
                        if (selected.includes(seatId)) {
                            selected = selected.filter(s => s !== seatId);
                            seat.classList.remove('selected');
                        } else {
                            selected.push(seatId);
                            seat.classList.add('selected');
                        }
                        updateSummary();
                    };
                }
                rowDiv.appendChild(seat);
            }
            grid.appendChild(rowDiv);
        }

        function updateSummary() {
            if (selected.length > 0) {
                selectedSeatsEl.innerText = selected.join(', ');
                totalPriceEl.innerText = (selected.length * 1500).toLocaleString();
                bookBtn.disabled = false;
            } else {
                selectedSeatsEl.innerText = 'ยังไม่ได้เลือก';
                totalPriceEl.innerText = '0';
                bookBtn.disabled = true;
            }
        }

        bookBtn.onclick = () => {
            modalSeatId.value = selected.join(', ');
            modal.style.display = 'flex';
        };

        function closeModal() {
            modal.style.display = 'none';
        }

        function confirmBooking() {
            const name = document.getElementById('customer-name').value.trim();
            const phone = document.getElementById('customer-phone').value.trim();

            if (!name || !phone) {
                alert('กรุณากรอกชื่อและเบอร์โทรศัพท์ให้ครบถ้วนครับ');
                return;
            }

            alert(`✅ ยืนยันการจองเรียบร้อย!\n\nที่นั่ง: ${selected.join(', ')}\nชื่อผู้จอง: ${name}\nเบอร์โทร: ${phone}\nราคารวม: ${(selected.length * 1500).toLocaleString()} บาท`);
            
            closeModal();
            location.reload();
        }
    </script>
</body>
</html>
